<!doctype html><meta charset="utf-8">
<style>
/* Source for architecture.png. Render: Chrome headless --screenshot --window-size=1600,600 */
body { margin:0; width:1600px; height:600px; background:#fff; font:500 30px/1.2 Helvetica, Arial, sans-serif; color:#07301f; display:flex; flex-direction:column; justify-content:center; gap:0; padding:0 40px; box-sizing:border-box; }
.panel { border:4px solid #0a5235; border-radius:28px; background:#eef3ec; padding:44px 30px 30px; position:relative; }
.panel > b { position:absolute; left:30px; top:-20px; background:#fff; padding:0 14px; font-size:28px; color:#0a5235; letter-spacing:.02em; }
.row { display:flex; align-items:center; justify-content:space-between; }
.box { background:#fada8a; border:3px solid #0a5235; border-radius:18px; padding:18px 22px; text-align:center; min-width:250px; font-weight:700; }
.box small { display:block; font-weight:500; font-size:24px; margin-top:4px; }
.arr { flex:1; text-align:center; font-size:24px; color:#0a5235; position:relative; min-width:80px; }
.arr::after { content:""; display:block; border-top:4px solid #0a5235; margin-top:6px; position:relative; }
.arr::before { content:""; position:absolute; right:0; bottom:-8px; border:10px solid transparent; border-left:16px solid #0a5235; border-right:0; }
.arr i { font-style:normal; font-family:ui-monospace, Menlo, monospace; font-size:22px; }
.down { text-align:center; font-size:24px; height:92px; position:relative; color:#0a5235; }
.down::before { content:""; position:absolute; left:50%; top:0; bottom:10px; border-left:4px solid #0a5235; }
.down::after { content:""; position:absolute; left:calc(50% - 10px); bottom:0; border:10px solid transparent; border-top:16px solid #0a5235; border-bottom:0; }
.down span { position:absolute; left:calc(50% + 18px); top:28px; background:#fff; padding:0 8px; font-family:ui-monospace, Menlo, monospace; font-size:22px; }
</style>
